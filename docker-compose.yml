services:
  # 1. Main Database
  db:
    image: postgres:15-alpine
    container_name: kala_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kala_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalasecret123}
      POSTGRES_DB: ${POSTGRES_DB:-kala_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kala_user} -d ${POSTGRES_DB:-kala_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Session
  redis:
    image: redis:7-alpine
    container_name: kala_redis
    restart: always
    volumes:
      - redis_data:/data

  # 3. Backend API (Python)
  backend:
    build:
      context: ./backend
    container_name: kala_backend
    restart: always
    ports:
      - "8000:8000" #ports
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kala_user}:${POSTGRES_PASSWORD:-kalasecret123}@db:5432/${POSTGRES_DB:-kala_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
    container_name: kala_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://api.kala.com
    depends_on:
      - backend

  # 5. Internal Gateway / Reverse Proxy (Nginx)
  reverse-proxy:
    image: nginx:alpine
    container_name: kala_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  # 6. Cloudflare Tunnel (Secure Ingress)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kala_cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - reverse-proxy

volumes:
  postgres_data:
  redis_data:
  